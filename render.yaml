services:
  - type: web
    name: unique-livraison-api-test
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && ALLOW_DEMO_SEED=true npm run seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_DISPATCHER_PASSWORD
        sync: false
      - key: DEMO_DRIVER_PASSWORD
        sync: false

  - type: web
    name: unique-livraison-dashboard-test
    runtime: node
    region: frankfurt
    plan: free
    rootDir: admin-dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
